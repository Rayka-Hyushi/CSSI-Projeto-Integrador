<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/navbar :: head('Editar Bairros')}"></head>

<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="flex-grow-1 py-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">
                <i class="bi bi-geo-alt me-2 text-primary"></i>Editar Bairros Atendidos
            </h2>
            <a th:href="@{/prestador/inicio}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>Voltar
            </a>
        </div>

        <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
        <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div>
                    <h5 class="mb-1">Selecione os bairros que você atende</h5>
                    <p class="text-muted small mb-0">Clientes poderão encontrar seus serviços filtrando por estes locais.</p>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="badge bg-secondary-subtle text-secondary border px-3 py-2" id="contadorBairros">
                        0 selecionado(s)
                    </span>
                    <button type="button" class="btn btn-sm btn-outline-primary" id="btnMarcarTodos">
                        <i class="bi bi-check-all me-1"></i>Marcar todos
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="btnDesmarcarTodos">
                        <i class="bi bi-x-lg me-1"></i>Desmarcar todos
                    </button>
                </div>
            </div>
            <div class="card-body">
                <form th:action="@{/prestador/bairros/atualizar}" method="post">
                    <!-- Barra de seleção global rápida -->
                    <div class="bg-light p-3 rounded mb-4 d-flex justify-content-between align-items-center border">
                        <div class="form-check form-switch mb-0">
                            <input class="form-check-input" type="checkbox" id="selecionarTodosBairros">
                            <label class="form-check-label fw-bold" for="selecionarTodosBairros">
                                Atender toda a cidade (selecionar todos os bairros)
                            </label>
                        </div>
                        <small class="text-muted d-none d-sm-inline">Marque para selecionar todos os bairros cadastrados</small>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-4 col-lg-3" th:each="bairro : ${todosOsBairros}">
                            <div class="form-check">
                                <input class="form-check-input bairro-checkbox" type="checkbox"
                                    name="bairros" th:value="${bairro.id}"
                                    th:id="'bairro_' + ${bairro.id}"
                                    th:checked="${prestador.bairros != null and prestador.bairros.contains(bairro)}">
                                <label class="form-check-label" th:for="'bairro_' + ${bairro.id}"
                                    th:text="${bairro.nomeBairro}"></label>
                            </div>
                        </div>
                    </div>

                    <div th:if="${#lists.isEmpty(todosOsBairros)}" class="text-center text-muted py-4">
                        Nenhum bairro cadastrado no sistema.
                    </div>

                    <hr class="my-4">

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/prestador/inicio}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>Salvar Alterações
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/navbar :: footer}"></footer>
<div th:replace="~{fragments/navbar :: scripts}"></div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const selectAllCheckbox = document.getElementById('selecionarTodosBairros');
        const btnMarcar = document.getElementById('btnMarcarTodos');
        const btnDesmarcar = document.getElementById('btnDesmarcarTodos');
        const contador = document.getElementById('contadorBairros');
        const checkboxes = document.querySelectorAll('input[name="bairros"]');

        if (!checkboxes || checkboxes.length === 0) return;

        function atualizarEstado() {
            const total = checkboxes.length;
            const selecionados = document.querySelectorAll('input[name="bairros"]:checked').length;
            if (contador) {
                contador.textContent = selecionados + ' de ' + total + ' selecionado(s)';
            }
            if (selectAllCheckbox) {
                if (selecionados === 0) {
                    selectAllCheckbox.checked = false;
                    selectAllCheckbox.indeterminate = false;
                } else if (selecionados === total) {
                    selectAllCheckbox.checked = true;
                    selectAllCheckbox.indeterminate = false;
                } else {
                    selectAllCheckbox.checked = false;
                    selectAllCheckbox.indeterminate = true;
                }
            }
        }

        if (selectAllCheckbox) {
            selectAllCheckbox.addEventListener('change', function () {
                const marcado = this.checked;
                checkboxes.forEach(cb => { cb.checked = marcado; });
                atualizarEstado();
            });
        }

        if (btnMarcar) {
            btnMarcar.addEventListener('click', function () {
                checkboxes.forEach(cb => { cb.checked = true; });
                atualizarEstado();
            });
        }

        if (btnDesmarcar) {
            btnDesmarcar.addEventListener('click', function () {
                checkboxes.forEach(cb => { cb.checked = false; });
                atualizarEstado();
            });
        }

        checkboxes.forEach(cb => {
            cb.addEventListener('change', atualizarEstado);
        });

        atualizarEstado();
    });
</script>
</body>

</html>
